name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Cible de déploiement"
        type: choice
        options: [auto, aws, render, none]
        default: auto

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false      # ne jamais interrompre un déploiement en cours

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # garde-fou : la config versionnée doit rester en testnet + dry_run
      - name: Safe defaults
        run: |
          python - <<'EOF'
          import yaml, sys
          c = yaml.safe_load(open("config.yaml"))
          if c["runtime"]["network"] != "testnet" or c["runtime"]["dry_run"] is not True:
              sys.exit("config.yaml must stay testnet + dry_run; arm live trading via the deployed volume")
          EOF

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Ajoutez des "required reviewers" à cet environnement dans GitHub pour
    # exiger une validation humaine avant chaque mise en production.
    environment: production
    env:
      TARGET: ${{ inputs.target || 'auto' }}
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to AWS EC2 (docker compose)
        if: env.EC2_HOST != '' && (env.TARGET == 'auto' || env.TARGET == 'aws')
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_REF,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/hl-swarm
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE="$IMAGE_REF"
            docker compose pull
            # research d'abord (sans impact sur le trading), puis live
            docker compose up -d --no-deps research
            docker compose up -d --no-deps live
            for i in $(seq 1 30); do
              curl -fs http://127.0.0.1:8080/health && exit 0
              sleep 5
            done
            echo "live container unhealthy after deploy" && docker compose logs --tail 200 live && exit 1

      - name: Deploy to Render (deploy hook)
        if: env.RENDER_HOOK != '' && (env.TARGET == 'auto' || env.TARGET == 'render')
        run: |
          curl -fsS -X POST "$RENDER_HOOK"   # Render reconstruit depuis le commit poussé

      - name: No target configured
        if: env.EC2_HOST == '' && env.RENDER_HOOK == ''
        run: echo "::notice::Image built and pushed; set EC2_* or RENDER_DEPLOY_HOOK_URL secrets to auto-deploy."
