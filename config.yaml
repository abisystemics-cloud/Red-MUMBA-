# =============================================================================
# hl-swarm — configuration centrale
# -----------------------------------------------------------------------------
# - Les secrets ne sont JAMAIS ici : ils viennent des variables d'environnement
#   (voir .env.example).
# - La section `strategy` est rechargée à chaud (sans couper les WebSockets).
#   L'agent Backtesting (#7) est le seul à la réécrire, dans les bornes de
#   `research.bounds`. Toute autre modification exige un redémarrage.
# =============================================================================

version: 1

runtime:
  # testnet | mainnet
  network: testnet
  # true = ordres simulés (paper trading) même si une clé est fournie
  dry_run: true
  log_level: INFO
  health_port: 8080
  # Le passage en réel exige network=mainnet, dry_run=false ET la variable
  # d'environnement LIVE_TRADING_CONFIRM=I_UNDERSTAND_THE_RISKS
  config_poll_seconds: 2.0

markets:
  # Perps Hyperliquid tradés + symboles de référence sur CEX
  - coin: BTC
    binance: btcusdt
    bybit: BTCUSDT
  - coin: ETH
    binance: ethusdt
    bybit: ETHUSDT

data:
  hyperliquid:
    ws_url_mainnet: wss://api.hyperliquid.xyz/ws
    ws_url_testnet: wss://api.hyperliquid-testnet.xyz/ws
    api_url_mainnet: https://api.hyperliquid.xyz
    api_url_testnet: https://api.hyperliquid-testnet.xyz
    # Le flux public l2Book est plafonné à 20 niveaux/côté (push >= 0,5 s).
    # Pour 100 niveaux, renseigner un fournisseur compatible (ex. Dwellir)
    # via HL_BOOK_WS_URL ; nLevels n'est envoyé que dans ce cas.
    book_levels: 100
    n_sig_figs: null
  binance_ws: wss://fstream.binance.com/stream
  bybit_ws: wss://stream.bybit.com/v5/public/linear
  liquidations:
    # coinglass | firecrawl | disabled
    provider: coinglass
    poll_seconds: 60
    coinglass_base_url: https://open-api-v4.coinglass.com
    coinglass_heatmap_path: /api/futures/liquidation/heatmap/model1
    # utilisé si provider=firecrawl (page publique, extraction JSON)
    firecrawl_url: ""
  # Positionnement des "whales" : adresses publiques Hyperliquid à suivre
  # (positions lues via l'endpoint public /info clearinghouseState).
  whales:
    addresses: []
    poll_seconds: 60
  record_market_data: true
  recordings_dir: data/recordings
  max_staleness_ms: 2500      # au-delà, la donnée est considérée morte

macro:
  enabled: true
  poll_seconds: 300
  # Fenêtres d'exclusion autour d'annonces planifiées (UTC, ISO 8601)
  blackout_minutes_before: 10
  blackout_minutes_after: 20
  scheduled_events: []
  #  - {name: "FOMC", at: "2026-12-09T19:00:00Z"}
  #  - {name: "US CPI", at: "2026-12-10T13:30:00Z"}
  # Déclencheurs de marché (kill switch sans LLM)
  btc_1m_move_halt_pct: 2.5
  cex_divergence_halt_bps: 80
  # Le LLM de recherche (Perplexity Sonar) ne peut qu'ESCALADER le risque,
  # jamais ouvrir un trade.
  llm_model: sonar
  llm_halt_threshold: 0.8      # score de risque [0..1] → HALT
  llm_caution_threshold: 0.5   # → CAUTION (taille réduite de moitié)

strategy:                       # ← section rechargée à chaud
  # Horizon : minutes à ~1 h. La microstructure sert de filtre d'entrée ;
  # l'avantage recherché vient du positionnement (funding, liquidations, whales).
  obi_depth: 10
  obi_decay: 0.15
  cvd_window_s: 300
  vpvr_window_s: 3600
  vpvr_bucket_bps: 10
  zscore_window: 1800
  spoof_size_mult: 8.0
  spoof_max_life_s: 3.0
  liq_max_dist_bps: 300
  weights:
    obi: 0.15
    cvd: 0.15
    premium: 0.10
    poc: 0.10
    funding: 0.20         # contrarien : funding extrême = foule trop positionnée
    liq: 0.10             # aimant vers le cluster de liquidations proche
    whale: 0.20           # biais net des adresses suivies
  entry_threshold: 1.4
  exit_threshold: 0.3
  persistence_ticks: 6
  max_spread_bps: 4.0
  max_hold_s: 3600
  cooldown_s: 120

risk:
  kelly_fraction: 0.25          # fraction de Kelly (Kelly plein = 1.0)
  max_risk_per_trade_pct: 0.5   # % de l'equity risqué au stop
  max_position_notional_usd: 5000
  max_leverage: 3
  stop_vol_mult: 2.5            # stop = k × σ réalisée × √stop_horizon_s
  stop_horizon_s: 600
  take_profit_r: 2.0            # TP en multiples du risque
  min_stop_bps: 8
  max_stop_bps: 300
  daily_loss_limit_pct: 3.0     # → HALT jusqu'au lendemain UTC
  max_consecutive_losses: 5
  slippage_bps: 3               # tolérance des ordres IOC
  prior_win_rate: 0.52
  prior_payoff: 1.2
  flatten_on_halt: true
  paper_equity_usd: 10000

execution:
  # maker = ordres post-only (ALO) posés au meilleur prix : frais bien plus bas,
  # exécution non garantie. taker = IOC immédiat (ancien comportement).
  mode: maker
  maker_timeout_s: 20           # entrée : délai max avant abandon
  requote_bps: 3                # replace l'ordre si le marché s'éloigne de plus de X bps
  max_requotes: 3
  exit_maker_timeout_s: 8       # sortie : tentative maker puis repli taker
  maker_fee_bps: 1.5            # à vérifier sur la grille de frais Hyperliquid
  taker_fee_bps: 4.5

telemetry:
  posthog_host: https://eu.i.posthog.com
  flush_interval_s: 1.0
  batch_size: 500
  distinct_id: hl-swarm-prod
  local_log_dir: data/telemetry

research:
  enabled: true
  check_interval_s: 3600
  lookback_hours: 24
  min_trades_for_eval: 20
  degrade_sharpe_below: 0.5
  degrade_winrate_below: 0.45
  max_drawdown_pct: 10.0        # contrainte dure du backtest
  n_trials: 30
  oos_fraction: 0.3             # walk-forward : part hors échantillon finale
  folds: 3                      # l'in-sample est découpé en N périodes ; un candidat
                                # est noté sur sa PIRE période (robustesse)
  min_oos_trades: 30
  min_sharpe_improvement: 0.3   # marge exigée, augmentée selon le nombre d'essais
  max_param_change_pct: 30      # changement max par mise à jour
  auto_deploy: false            # les premiers mois : l'agent propose, un humain valide
  bounds:
    entry_threshold: [1.0, 3.0]
    exit_threshold: [0.1, 1.0]
    persistence_ticks: [1, 8]
    obi_depth: [3, 20]
    cvd_window_s: [15, 300]
    weights.obi: [0.0, 0.7]
    weights.cvd: [0.0, 0.7]
    weights.premium: [0.0, 0.7]
    weights.poc: [0.0, 0.4]
    weights.funding: [0.0, 0.6]
    weights.liq: [0.0, 0.4]
    weights.whale: [0.0, 0.6]

# Critères de passage en réel, fixés AVANT de voir les résultats.
go_live:
  min_trades: 200
  min_profit_factor: 1.2
  max_drawdown_pct: 5.0
  min_positive_weeks: 3
  weeks: 4
  report_interval_h: 168        # rapport hebdomadaire

# Canal de supervision : le bot lit des commandes signées par commit dans la
# branche GitHub `control` (fichier control/commands.json) et rend compte via
# la télémétrie (événements command_ack, command_applied, status_snapshot).
# Jeton GitHub en LECTURE SEULE : CONTROL_GITHUB_TOKEN ; dépôt : CONTROL_GITHUB_REPO.
control:
  enabled: true
  branch: control
  path: control/commands.json
  poll_seconds: 30
  status_interval_s: 300        # instantané d'état envoyé à PostHog
  max_command_age_s: 3600       # une commande plus vieille est ignorée

alerts:
  # Telegram : TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID dans l'environnement
  enabled: true
  min_interval_s: 300           # anti-spam : même alerte au plus toutes les 5 min
  feed_down_after_s: 30
